<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PyHost — Bot Hosting</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
:root{
  --bg:#070910;--surface:#0c0e16;--card:#10131c;--border:#1a1f2e;--border2:#222840;
  --accent:#4f8ef7;--accent2:#6366f1;--green:#22c55e;--red:#ef4444;
  --yellow:#f59e0b;--orange:#f97316;--text:#dde3f0;--muted:#5a6480;--dim:#2a3050;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── LOGIN ── */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:900}
.lbox{width:360px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:36px;display:flex;flex-direction:column;gap:20px}
.llogo{font-family:var(--mono);font-size:20px;font-weight:700;display:flex;align-items:center;gap:9px}
.ldot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.lsub{font-family:var(--mono);font-size:12px;color:var(--muted)}
.fl{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;font-family:var(--mono)}
.fi{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:9px 12px;font-family:var(--mono);font-size:12px;color:var(--text);outline:none;transition:border-color .15s}
.fi:focus{border-color:var(--accent)}
.bp{width:100%;padding:10px;background:var(--accent);border:none;border-radius:7px;color:#fff;font-family:var(--mono);font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s}
.bp:hover{opacity:.85}
.lerr{font-size:12px;color:var(--red);text-align:center;font-family:var(--mono);display:none}
.lhint{font-size:11px;color:var(--muted);text-align:center;font-family:var(--mono)}

/* ── APP ── */
#app{display:none;height:100vh;flex-direction:column}
#app.on{display:flex}
.topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:14px;flex-shrink:0}
.tlogo{font-family:var(--mono);font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.tspace{flex:1}
.tuser{font-family:var(--mono);font-size:11px;color:var(--muted)}
.blog{background:none;border:1px solid var(--border2);border-radius:6px;padding:5px 11px;color:var(--muted);font-family:var(--mono);font-size:11px;cursor:pointer;transition:all .15s}
.blog:hover{border-color:var(--red);color:var(--red)}
.main{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{width:210px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.slabel{padding:16px 14px 5px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-family:var(--mono)}
.nav{display:flex;align-items:center;gap:9px;padding:8px 14px;font-size:12px;color:var(--muted);cursor:pointer;transition:all .12s;border-left:2px solid transparent;font-weight:500}
.nav:hover{background:var(--card);color:var(--text)}
.nav.on{background:var(--card);color:var(--accent);border-left-color:var(--accent)}
.nicon{width:16px;text-align:center;font-size:14px}
.sbots{padding:6px;flex:1;overflow-y:auto}
.bitem{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:7px;cursor:pointer;transition:background .12s;margin-bottom:1px}
.bitem:hover{background:var(--card)}
.bitem.on{background:var(--border)}
.bdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.bname{font-family:var(--mono);font-size:11px;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── CONTENT ── */
.content{flex:1;overflow-y:auto;padding:22px}

/* ── CARDS ── */
.panel{background:var(--card);border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:18px}
.ph{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
.pt{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--text);flex:1}
.pb{padding:18px}

/* ── STATS ── */
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:14px 16px}
.sl{font-size:10px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
.sv{font-size:24px;font-weight:700;font-family:var(--mono);margin-top:5px}
.ss{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;font-family:var(--mono)}
.bg{background:#16a34a1a;color:var(--green);border:1px solid #16a34a33}
.br{background:#ef44441a;color:var(--red);border:1px solid #ef444433}
.bb{background:#4f8ef71a;color:var(--accent);border:1px solid #4f8ef733}
.by{background:#f59e0b1a;color:var(--yellow);border:1px solid #f59e0b33}
.bd{width:5px;height:5px;border-radius:50%;background:currentColor}

/* ── BUTTONS ── */
.bs{padding:5px 11px;border-radius:6px;font-family:var(--mono);font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--surface);color:var(--text);transition:all .12s}
.bs:hover{background:var(--border)}
.bs:disabled{opacity:.4;cursor:not-allowed}
.bsg{border-color:#16a34a33;color:var(--green)}.bsg:hover{background:#16a34a1a}
.bsr{border-color:#ef444433;color:var(--red)}.bsr:hover{background:#ef44441a}
.bsb{border-color:#4f8ef733;color:var(--accent)}.bsb:hover{background:#4f8ef71a}
.bsy{border-color:#f59e0b33;color:var(--yellow)}.bsy:hover{background:#f59e0b1a}
.bprim{background:var(--accent);border:none;border-radius:7px;color:#fff;font-family:var(--mono);font-size:12px;font-weight:600;padding:9px 16px;cursor:pointer;transition:opacity .15s;width:100%}
.bprim:hover{opacity:.85}
.bprim:disabled{opacity:.4;cursor:not-allowed}

/* ── FORM ── */
.fg{margin-bottom:14px}
.fl2{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;font-family:var(--mono)}
.fi2,.fsel,.fta{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:8px 11px;font-family:var(--mono);font-size:12px;color:var(--text);outline:none;transition:border-color .15s}
.fi2:focus,.fsel:focus,.fta:focus{border-color:var(--accent)}
.fta{resize:vertical;min-height:72px}
.fsel{appearance:none}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── UPLOAD ── */
.uzone{border:2px dashed var(--border2);border-radius:10px;padding:30px;text-align:center;cursor:pointer;transition:all .15s;background:var(--surface)}
.uzone:hover,.uzone.over{border-color:var(--accent);background:#4f8ef708}
.uicon{font-size:30px;margin-bottom:10px}
.utitle{font-family:var(--mono);font-size:13px;color:var(--text);margin-bottom:4px}
.usub{font-size:11px;color:var(--muted);font-family:var(--mono)}

/* ── LOG ── */
.log{background:#060810;border-radius:9px;padding:14px;font-family:var(--mono);font-size:11px;line-height:1.7;height:300px;overflow-y:auto;color:#8892aa;border:1px solid var(--border)}
.ll{display:flex;gap:9px;flex-wrap:wrap}
.lt{color:var(--muted);flex-shrink:0}
.li{color:var(--accent)}.lw{color:var(--yellow)}.le{color:var(--red)}.lo{color:var(--green)}
.lm{color:#b0bcd0}

/* ── BARS ── */
.rb{margin-bottom:12px}
.rbh{display:flex;justify-content:space-between;margin-bottom:5px}
.rbl{font-family:var(--mono);font-size:11px;color:var(--muted)}
.rbv{font-family:var(--mono);font-size:11px;font-weight:600}
.rbt{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.rbf{height:100%;border-radius:3px;transition:width .5s ease}

/* ── TABLE ── */
.dt{width:100%;border-collapse:collapse}
.dt th{padding:9px 12px;text-align:left;font-family:var(--mono);font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border)}
.dt td{padding:9px 12px;font-family:var(--mono);font-size:11px;color:var(--text);border-bottom:1px solid var(--border)}
.dt tr:last-child td{border-bottom:none}
.dt tr:hover td{background:var(--surface)}

/* ── TABS ── */
.tabs{display:flex;gap:1px;border-bottom:1px solid var(--border);margin-bottom:18px}
.tab{padding:8px 16px;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .12s;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}

/* ── EMPTY ── */
.empty{text-align:center;padding:50px 20px}
.ei{font-size:40px;margin-bottom:12px;opacity:.35}
.et{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--muted);margin-bottom:5px}
.es{font-size:12px;color:var(--dim)}

/* ── PROGRESS ── */
.prog{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:6px}
.pf{height:100%;background:var(--accent);transition:width .25s}

/* ── NOTIFS ── */
#notifs{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:7px;z-index:9999;pointer-events:none}
.notif{background:var(--card);border:1px solid var(--border2);border-radius:9px;padding:10px 16px;font-family:var(--mono);font-size:11px;color:var(--text);display:flex;align-items:center;gap:9px;min-width:240px;animation:sin .2s ease;pointer-events:all}
.notif.ns{border-left:3px solid var(--green)}
.notif.ne{border-left:3px solid var(--red)}
.notif.ni{border-left:3px solid var(--accent)}
@keyframes sin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.pulse{animation:pulse 1.8s infinite}

/* ── EDITOR MODAL ── */
#editor-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:500}
#editor-modal.on{display:flex}
.ebox{background:var(--card);border:1px solid var(--border2);border-radius:13px;padding:24px;width:700px;max-width:96vw;max-height:90vh;display:flex;flex-direction:column;gap:16px}
.etitle{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--text)}
.ecode{width:100%;flex:1;min-height:380px;background:#060810;border:1px solid var(--border);border-radius:7px;padding:12px;font-family:var(--mono);font-size:12px;color:#b0bcd0;outline:none;resize:vertical;line-height:1.6}
.ebtns{display:flex;gap:8px;justify-content:flex-end}

@media(max-width:900px){.sgrid{grid-template-columns:1fr 1fr}.sidebar{width:170px}}
@media(max-width:600px){.sidebar{display:none}.sgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="lbox">
    <div><div class="llogo"><div class="ldot"></div>PyHost</div>
    <div class="lsub" style="margin-top:5px">Telegram Bot Hosting Panel</div></div>
    <div><label class="fl">Username</label><input class="fi" id="lu" autocomplete="off" placeholder="admin"/></div>
    <div><label class="fl">Password</label><input class="fi" id="lp" type="password" placeholder="••••••••"/></div>
    <button class="bp" id="lbtn">Sign In</button>
    <div class="lerr" id="lerr">Invalid credentials</div>
    <div class="lhint">Default · admin / admin123</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="tlogo"><div class="ldot"></div>PyHost</div>
    <div class="tspace"></div>
    <div class="tuser" id="tuser"></div>
    <button class="blog" id="loutbtn">Logout</button>
  </div>
  <div class="main">
    <div class="sidebar">
      <div class="slabel">Menu</div>
      <div class="nav on" data-v="dashboard"><span class="nicon">◈</span>Dashboard</div>
      <div class="nav" data-v="bots"><span class="nicon">🤖</span>My Bots</div>
      <div class="nav" data-v="upload"><span class="nicon">↑</span>Upload Bot</div>
      <div class="nav" data-v="packages"><span class="nicon">📦</span>Packages</div>
      <div class="nav" data-v="logs"><span class="nicon">▤</span>All Logs</div>
      <div class="nav" data-v="settings"><span class="nicon">⚙</span>Settings</div>
      <div class="slabel" style="margin-top:8px">Bots</div>
      <div class="sbots" id="sbots"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- FILE EDITOR MODAL -->
<div id="editor-modal">
  <div class="ebox">
    <div class="etitle" id="editor-title">Edit File</div>
    <textarea class="ecode" id="editor-code"></textarea>
    <div class="ebtns">
      <button class="bs" onclick="closeEditor()">Cancel</button>
      <button class="bs bsb" onclick="saveFile()">Save File</button>
    </div>
  </div>
</div>

<!-- NOTIFS -->
<div id="notifs"></div>

<script>
/* ══════════════ STATE ══════════════ */
const S = { user: null, bots: [], view: 'dashboard', bot: null };
let _editorBot = null, _editorFile = null;
let _liveLogEs = null, _statsInterval = null;

/* ══════════════ API ══════════════ */
const api = {
  async req(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch('/api' + path, opts);
    return r.json();
  },
  get:    (p)    => api.req('GET', p),
  post:   (p, b) => api.req('POST', p, b),
  patch:  (p, b) => api.req('PATCH', p, b),
  delete: (p)    => api.req('DELETE', p),
  put:    (p, b) => api.req('PUT', p, b),
};

/* ══════════════ NOTIFY ══════════════ */
function notify(msg, type='info') {
  const icons = { success:'✓', error:'✕', info:'·' };
  const el = document.createElement('div');
  el.className = `notif n${type[0]}`;
  el.innerHTML = `<span>${icons[type]||'·'}</span><span>${msg}</span>`;
  document.getElementById('notifs').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

/* ══════════════ LOGIN ══════════════ */
document.getElementById('lbtn').onclick = doLogin;
document.getElementById('lp').onkeydown = e => e.key==='Enter' && doLogin();

async function doLogin() {
  const u = document.getElementById('lu').value.trim();
  const p = document.getElementById('lp').value;
  const r = await api.post('/login', { username: u, password: p });
  if (r.ok) {
    S.user = u;
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').classList.add('on');
    document.getElementById('tuser').textContent = u;
    loadAndRender('dashboard');
    startStatsPoll();
  } else {
    document.getElementById('lerr').style.display = 'block';
  }
}

document.getElementById('loutbtn').onclick = async () => {
  await api.post('/logout');
  location.reload();
};

/* ══════════════ NAV ══════════════ */
document.querySelectorAll('.nav[data-v]').forEach(el => {
  el.onclick = () => loadAndRender(el.dataset.v);
});

function setNav(v) {
  document.querySelectorAll('.nav[data-v]').forEach(el =>
    el.classList.toggle('on', el.dataset.v === v));
}

/* ══════════════ SIDEBAR BOTS ══════════════ */
function renderSidebar() {
  const el = document.getElementById('sbots');
  if (!el) return;
  el.innerHTML = S.bots.map(b => `
    <div class="bitem ${S.bot?.id===b.id?'on':''}" onclick="openBot('${b.id}')">
      <div class="bdot" style="background:${b.status==='running'?'var(--green)':'var(--red)'}"></div>
      <div class="bname">${b.name}</div>
    </div>`).join('');
}

/* ══════════════ ROUTER ══════════════ */
async function loadAndRender(view, arg) {
  S.view = view;
  setNav(view);
  stopLiveLog();
  const c = document.getElementById('content');

  if (view === 'dashboard') {
    const [st, bl] = await Promise.all([api.get('/stats'), api.get('/bots')]);
    S.bots = bl.bots || [];
    renderSidebar();
    c.innerHTML = renderDashboard(st);
  } else if (view === 'bots') {
    const r = await api.get('/bots');
    S.bots = r.bots || [];
    renderSidebar();
    c.innerHTML = renderBots();
  } else if (view === 'upload') {
    c.innerHTML = renderUpload();
    initUpload();
  } else if (view === 'packages') {
    const r = await api.get('/bots');
    S.bots = r.bots || [];
    c.innerHTML = renderPackages();
    initPkgInstall();
  } else if (view === 'logs') {
    const r = await api.get('/bots');
    S.bots = r.bots || [];
    c.innerHTML = renderAllLogs(arg);
    if (arg) startLiveLog(arg);
  } else if (view === 'settings') {
    c.innerHTML = renderSettings();
  } else if (view === 'bot-detail') {
    const r = await api.get(`/bots/${arg}`);
    if (!r.ok) { notify('Bot not found','error'); return; }
    S.bot = r.bot;
    renderSidebar();
    c.innerHTML = renderBotDetail(r.bot);
    initBotDetail(r.bot);
  }
}

function openBot(id) {
  S.bot = { id };
  loadAndRender('bot-detail', id);
}

/* ══════════════ DASHBOARD ══════════════ */
function renderDashboard(st) {
  return `
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
    <div style="font-family:var(--mono);font-size:18px;font-weight:700">Dashboard</div>
    <div class="tspace"></div>
    <button class="bs bsb" onclick="loadAndRender('upload')">+ Upload Bot</button>
  </div>
  <div class="sgrid">
    <div class="sc"><div class="sl">Total</div><div class="sv" style="color:var(--text)">${st.total}</div><div class="ss">Bots registered</div></div>
    <div class="sc"><div class="sl">Running</div><div class="sv" style="color:var(--green)">${st.running}</div><div class="ss">Active now</div></div>
    <div class="sc"><div class="sl">Stopped</div><div class="sv" style="color:var(--red)">${st.stopped}</div><div class="ss">Idle</div></div>
    <div class="sc"><div class="sl">Platform</div><div class="sv" style="color:var(--accent);font-size:14px">Online</div><div class="ss">Render free tier</div></div>
  </div>
  <div class="panel">
    <div class="ph"><div class="pt">⚡ All Bots</div></div>
    <div class="pb">
      ${S.bots.length===0
        ? `<div class="empty"><div class="ei">🤖</div><div class="et">No bots yet</div><div class="es">Upload your first bot to get started</div></div>`
        : `<table class="dt"><thead><tr>
            <th>Name</th><th>Status</th><th>Uptime</th><th>File</th><th>Actions</th>
           </tr></thead><tbody>
           ${S.bots.map(b=>`<tr>
             <td style="color:var(--accent);cursor:pointer;font-weight:600" onclick="openBot('${b.id}')">${b.name}</td>
             <td>${sbadge(b.status)}</td>
             <td>${fmtUp(b.uptime)}</td>
             <td style="color:var(--muted)">${b.file||'—'}</td>
             <td style="display:flex;gap:5px">
               ${b.status==='running'
                 ?`<button class="bs bsr" onclick="botStop('${b.id}')">Stop</button>
                   <button class="bs bsy" onclick="botRestart('${b.id}')">↺</button>`
                 :`<button class="bs bsg" onclick="botStart('${b.id}')">Start</button>`}
               <button class="bs" onclick="loadAndRender('logs','${b.id}')">Logs</button>
             </td>
           </tr>`).join('')}
           </tbody></table>`}
    </div>
  </div>`;
}

/* ══════════════ BOTS LIST ══════════════ */
function renderBots() {
  return `
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
    <div style="font-family:var(--mono);font-size:18px;font-weight:700">My Bots</div>
    <div class="tspace"></div>
    <button class="bs bsb" onclick="loadAndRender('upload')">+ Upload</button>
  </div>
  ${S.bots.length===0
    ? `<div class="empty"><div class="ei">🤖</div><div class="et">No bots yet</div></div>`
    : `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:13px">
        ${S.bots.map(b=>`
          <div style="background:var(--card);border:1px solid ${b.status==='running'?'#16a34a33':'var(--border)'};border-radius:11px;padding:16px;cursor:pointer" onclick="openBot('${b.id}')">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">

let _uploadFile = null;
function initUpload() {
  const zone = document.getElementById('drop-zone');
  const fi   = document.getElementById('fi');
  zone.onclick = () => fi.click();
  fi.onchange  = () => setFile(fi.files[0]);
  zone.ondragover  = e => { e.preventDefault(); zone.classList.add('over'); };
  zone.ondragleave = () => zone.classList.remove('over');
  zone.ondrop = e => { e.preventDefault(); zone.classList.remove('over'); setFile(e.dataTransfer.files[0]); };
}

function setFile(f) {
  if (!f) return;
  _uploadFile = f;
  const el = document.getElementById('upload-fname');
  el.textContent = `✓ ${f.name} (${fmtSize(f.size)})`;
  el.style.display = 'block';
}

async function doDeploy() {
  const name = document.getElementById('nb-name').value.trim();
  if (!name) { notify('Enter a bot name','error'); return; }
  if (!_uploadFile) { notify('Select a file first','error'); return; }

  const btn = document.getElementById('deploy-btn');
  btn.disabled = true; btn.textContent = 'Deploying...';

  const prog = document.getElementById('upload-prog');
  const fill = document.getElementById('upload-fill');
  prog.style.display = 'block';

  const fd = new FormData();
  fd.append('name', name);
  fd.append('start_cmd', document.getElementById('nb-cmd').value.trim() || 'python bot.py');
  fd.append('env', document.getElementById('nb-env').value);
  fd.append('auto_restart', document.getElementById('nb-ar').checked ? 'true' : 'false');
  fd.append('file', _uploadFile);

  const xhr = new XMLHttpRequest();
  xhr.upload.onprogress = e => { if (e.lengthComputable) fill.style.width = (e.loaded/e.total*100)+'%'; };
  xhr.onload = () => {
    const r = JSON.parse(xhr.responseText);
    if (r.ok) {
      notify(`${name} deployed!`, 'success');
      _uploadFile = null;
      setTimeout(() => loadAndRender('bots'), 600);
    } else {
      notify(r.error || 'Deploy failed', 'error');
      btn.disabled = false; btn.textContent = '🚀 Deploy Bot';
    }
  };
  xhr.onerror = () => { notify('Network error','error'); btn.disabled=false; btn.textContent='🚀 Deploy Bot'; };
  xhr.open('POST', '/api/bots/upload');
  xhr.send(fd);
}

function initPkgInstall() {}

async function installPkg() {
  const botId = document.getElementById('pkg-bot').value;
  const pkg   = document.getElementById('pkg-name').value.trim();
  if (!pkg) { notify('Enter package name','error'); return; }

  const out = document.getElementById('pkg-out');
  const log = document.getElementById('pkg-log');
  out.style.display = 'block';
  log.innerHTML = '';

  const es = new EventSource(`/api/bots/${botId}/packages/install`);
  // We actually POST, so use fetch streaming:
  const r = await fetch(`/api/bots/${botId}/packages/install`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ package: pkg })
  });
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value);
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      if (line.startsWith('data: ')) {
        const msg = line.slice(6);
        if (msg === '__DONE__') { notify(`${pkg} installed`, 'success'); loadAndRender('packages'); return; }
        const div = document.createElement('div');
        div.className = 'll';
        const lvl = msg.startsWith('[OK]')?'o':msg.startsWith('[ERR]')?'e':'i';
        div.innerHTML = `<span class="l${lvl}">${msg}</span>`;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
      }
    }
  }
}

}

function startLiveLog(botId) {
  stopLiveLog();
  _liveLogEs = new EventSource(`/api/bots/${botId}/logs/stream`);
  _liveLogEs.onmessage = e => {
    const logEl = document.getElementById('live-log') || document.getElementById('main-log');
    if (!logEl) { stopLiveLog(); return; }
    try {
      const l = JSON.parse(e.data);
      appendLogLine(logEl, l);
      logEl.scrollTop = logEl.scrollHeight;
    } catch {}
  };
}

function stopLiveLog() {
  if (_liveLogEs) { _liveLogEs.close(); _liveLogEs = null; }
}

function appendLogLine(el, l) {
  const div = document.createElement('div');
  div.className = 'll';
  const cls = l.lvl==='ok'?'o':l.lvl==='warn'?'w':l.lvl==='err'?'e':'i';
  div.innerHTML = `<span class="lt">${l.t}</span><span class="l${cls}">[${l.lvl.toUpperCase()}]</span><span class="lm">${escHtml(l.msg)}</span>`;
  el.appendChild(div);
}

async function clearLog(botId) {
  await api.delete(`/bots/${botId}/logs`);
  const el = document.getElementById('live-log') || document.getElementById('main-log');
  if (el) el.innerHTML = '';
  notify('Log cleared','info');
}

      S.bots = r.bots || [];
      renderSidebar();
    }
  }, 8000);
}

/* ══════════════ HELPERS ══════════════ */
function sbadge(s) {
  if (s==='running') return `<span class="badge bg"><span class="bd"></span>Running</span>`;
  return `<span class="badge br"><span class="bd"></span>Stopped</span>`;
}
function fmtUp(s) {
  if (!s) return '—';
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60);
  return h?`${h}h ${m}m`:`${m}m`;
}
function fmtSize(b) {
  if (b<1024) return b+'B';
  if (b<1048576) return (b/1024).toFixed(1)+'KB';
  return (b/1048576).toFixed(1)+'MB';
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
